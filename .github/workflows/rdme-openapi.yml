# Publishes the API reference to ReadMe on every merge to main.
#
# Uses rdme@v10, which is the version for ReadMe Refactored. v9 addressed an API
# definition by `--id`; Refactored addresses it by slug, so the old
# `--id=696e4ddb…` no longer resolves.
#
# ⚠️  Renaming an OpenAPI tag does NOT restructure the docs on its own.
#     ReadMe maps tags to reference subpages when a definition is first created
#     and does not propagate later additions or removals — a removed tag leaves
#     an orphaned subpage, and a new tag gets no subpage, so endpoints keep
#     rendering under the old headings however many times this runs.
#     See https://github.com/readmeio/rdme/issues/1173 (open as of 2026-09).
#     After changing tag names, reconcile the subpages in the ReadMe dashboard —
#     or delete and re-create the definition, which rebuilds the tree cleanly.
#     Treat tag names as sticky: each rename costs manual work.
name: ReadMe GitHub Action 🦉

on:
  push:
    branches:
      - main

jobs:
  rdme-openapi:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo 📚
        uses: actions/checkout@v4

      # Strips x-internal operations, then any path left with no operations, then
      # any declared tag no longer used by a surviving operation. Without the
      # last step, a tag whose only endpoints are internal renders as an empty
      # section in the published docs.
      - name: Strip internal endpoints
        uses: mikefarah/yq@master
        with:
          cmd: yq 'del(.paths[][] | select(.x-internal == true)) | del(.paths[] | select(length == 0)) | [.paths[][].tags[]] as $used | .tags |= map(select(.name as $n | $used | any_c(. == $n)))' terraform/accounts-service.yml > terraform/accounts-service-public.yml

      # --slug is pinned deliberately. rdme infers the slug from the spec's path
      # when it isn't given, which for `terraform/accounts-service-public.yml`
      # would be `terraform-accounts-service-public.yml` — a slug that doesn't
      # exist, so the upload would silently create a SECOND definition instead of
      # updating the live one. The value below must match the definition's slug
      # in ReadMe.
      #
      # --confirm-overwrite is required in CI: without it the command prompts
      # before overwriting and there is nothing to answer the prompt.
      - name: Upload API definition 🚀
        uses: readmeio/rdme@v10
        with:
          rdme: openapi upload terraform/accounts-service-public.yml --key=${{ secrets.README_API_KEY }} --slug=accounts-service.json --confirm-overwrite
